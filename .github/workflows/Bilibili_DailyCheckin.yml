name: Bilibili Checkin WebUI

on:
  schedule:
    - cron: '0 3 * * *'  # UTC时间每天3点执行(对应CST时间 11:00)
  workflow_dispatch:  # 支持手动触发

jobs:
  run-bilibili-task:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bilibili Task
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          TASK_CONFIG: ${{ vars.TASK_CONFIG }}
          COIN_ADD_NUM: ${{ vars.COIN_ADD_NUM }}
          COIN_SELECT_LIKE: ${{ vars.COIN_SELECT_LIKE }}
          COIN_VIDEO_SOURCE: ${{ vars.COIN_VIDEO_SOURCE }}

        run: python main.py
